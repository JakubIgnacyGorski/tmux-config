# ---------------------- Set config directory -----------------------
if-shell '[ -z "#{@tmux_config_dir}" ]' \
    'run-shell "tmux set -g @tmux_config_dir \"$(tmux display-message -p \"#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME}/tmux,#{HOME}/.tmux}\")\""'

# ----------------------------- Plugins -----------------------------
## List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'

## Initalize TMUX plugin manager
run '#{@tmux_config_dir}/plugins/tpm/tpm'

# ---------------------------- Shortcuts ---------------------------- 
## Switch panes using Alt + vi keys without prefix
bind -n M-l select-pane -R
bind -n M-h select-pane -L
bind -n M-k select-pane -U
bind -n M-j select-pane -D

## When creating window/pane use current path
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# -------------------------- Main settings --------------------------

## Enable mouse control
set -g mouse on

## Set VI mode globally
setw -g mode-keys vi

## Don't rename windows automatically
set-option -g allow-rename off

## Set bigger history limit
set -g history-limit 10000

set-option -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@tmux_config_dir}/clipboard.sh"

## Add yazi image preview support

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

## Auto renumerate windows
set-option -g renumber-windows on

# -------------------------- Visual settings --------------------------

set -g status-position top
if-shell '[ -d "$XDG_CONFIG_HOME/tmux" ]' \
    'source-file "$XDG_CONFIG_HOME/tmux/theme.conf"' \
    'source-file "$HOME/.tmux/theme.conf"'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
